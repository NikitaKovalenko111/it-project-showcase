      responses: {'200': {description: Решение по NDA}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Введите только `access_token`, полученный из `POST /auth/login`, без префикса `Bearer`.
        Для операций с замком Swagger UI добавит заголовок
        `Authorization: Bearer <access_token>` автоматически.
  parameters:
    UserID: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    StudentID: {name: student_id, in: path, required: true, schema: {type: string, format: uuid}}
    CompanyID: {name: company_id, in: path, required: true, schema: {type: string, format: uuid}}
    CaseID: {name: case_id, in: path, required: true, schema: {type: string, format: uuid}}
    TeamID: {name: team_id, in: path, required: true, schema: {type: string, format: uuid}}
    ApplicationID: {name: application_id, in: path, required: true, schema: {type: string, format: uuid}}
    ExecutionID: {name: execution_id, in: path, required: true, schema: {type: string, format: uuid}}
    SubmissionID: {name: submission_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProjectID: {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
    CommentID: {name: comment_id, in: path, required: true, schema: {type: string, format: uuid}}
    ReportID: {name: report_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProgramID: {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    FileID: {name: file_id, in: path, required: true, schema: {type: string, format: uuid}}
    StageID: {name: stage_id, in: path, required: true, schema: {type: string, format: uuid}}
    InvitationID: {name: invitation_id, in: path, required: true, schema: {type: string, format: uuid}}
    EvaluationID: {name: evaluation_id, in: path, required: true, schema: {type: string, format: uuid}}
    AwardID: {name: award_id, in: path, required: true, schema: {type: string, format: uuid}}
    NotificationID: {name: notification_id, in: path, required: true, schema: {type: string, format: uuid}}
    GrantID: {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
    ResourceType: {name: resource_type, in: path, required: true, schema: {type: string, enum: [case, student_project]}}
    ResourceID: {name: resource_id, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  requestBodies:
    FileUpload:
      required: true
      content:
        multipart/form-data:
          schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
    Comment:
      required: true
      content:
        application/json: {schema: {type: object, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 4000}}}}
  responses:
    Unauthorized: {description: Access token отсутствует или недействителен, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Недостаточно прав, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Ресурс не найден или скрыт проверкой доступа, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Конфликт состояния или уникальности, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Validation: {description: Доменная валидация не пройдена, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}, details: {type: object, additionalProperties: true}}
    ItemsResponse: {type: object, required: [items], properties: {items: {type: array, items: {type: object, additionalProperties: true}}}}
    FlatCursorPage:
      allOf:
        - {$ref: '#/components/schemas/ItemsResponse'}
        - {type: object, required: [next_cursor], properties: {next_cursor: {type: string, nullable: true}}}
    FlatPage:
      allOf:
        - {$ref: '#/components/schemas/ItemsResponse'}
        - {type: object, required: [page, page_size, total], properties: {page: {type: integer}, page_size: {type: integer}, total: {type: integer}}}
    CursorPage:
      allOf:
        - {$ref: '#/components/schemas/ItemsResponse'}
        - {type: object, properties: {meta: {type: object, properties: {next_cursor: {type: string, nullable: true}, has_more: {type: boolean}}}}}
    Page:
      allOf:
        - {$ref: '#/components/schemas/ItemsResponse'}
        - {type: object, properties: {meta: {type: object, required: [page, page_size, total], properties: {page: {type: integer}, page_size: {type: integer}, total: {type: integer}}}}}
    LoginRequest: {type: object, required: [login, password], properties: {login: {type: string}, password: {type: string, format: password}}}
    RegisterRequest:
      type: object
      description: Для student обязательны личные и учебные поля. Для остальных доступных ролей создаётся заявка на подтверждение.
      required: [username, email, password, consent_version]
      oneOf:
        - required: [last_name, first_name, institute, direction, course, group_name]
          properties:
            role: {type: string, enum: [student]}
        - required: [role]
          properties:
            role: {type: string, enum: [company_representative, university_staff]}
      properties:
        role: {type: string, enum: [student, company_representative, university_staff], default: student}
        username: {type: string, minLength: 3, maxLength: 32}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
        last_name: {type: string}
        first_name: {type: string}
        institute: {type: string}
        direction: {type: string}
        education_level: {type: string, maxLength: 150}
        course: {type: integer, minimum: 1, maximum: 8}
        group_name: {type: string}
        consent_version: {type: string}
    AuthTokens: {type: object, required: [user_id, access_token, refresh_token, token_type], properties: {user_id: {type: string, format: uuid}, access_token: {type: string}, refresh_token: {type: string}, token_type: {type: string, enum: [Bearer]}}}
    CompanyInput: {type: object, required: [full_name], properties: {full_name: {type: string}, short_name: {type: string}, industry: {type: string}, description: {type: string}, website: {type: string, format: uri}}}
    EvaluationCriterionInput: {type: object, required: [name, max_score, ordinal], properties: {name: {type: string}, max_score: {type: number, exclusiveMinimum: true, minimum: 0}, ordinal: {type: integer, minimum: 1}}}
    CaseInput:
      type: object
      required: [company_id, title, summary, full_brief, type, work_format, participation_mode, admission_mode, result_requirements, ip_terms, evaluation_criteria]
      properties:
        company_id: {type: string, format: uuid}
        title: {type: string}
        summary: {type: string}
        full_brief: {type: string}
        type: {type: string, enum: [educational, contest, paid, other_reward]}
        event_format: {type: string, enum: [case, hackathon, olympiad], default: case, description: Формат мероприятия компании; не является категорией студенческого проекта.}
        work_format: {type: string, enum: [remote, onsite, hybrid]}
        participation_mode: {type: string, enum: [individual, team, both]}
        capacity: {type: integer, minimum: 1, maximum: 10000, description: Обязательный при создании лимит команд или индивидуальных участников.}
        team_size_min: {type: integer, minimum: 1, maximum: 100, description: Обязательный при создании минимальный размер команды.}
        team_size_max: {type: integer, minimum: 1, maximum: 100, description: Обязательный при создании максимальный размер команды.}
        admission_mode: {type: string, enum: [open, selection, test, invitation]}
        result_requirements: {type: string}
        ip_terms: {type: string}
        nda_required: {type: boolean}
        evaluation_criteria: {type: array, items: {$ref: '#/components/schemas/EvaluationCriterionInput'}}
    CaseStageInput: {type: object, required: [ordinal, title], properties: {ordinal: {type: integer, minimum: 1}, title: {type: string, minLength: 1, maxLength: 300}, expected_result: {type: string, maxLength: 3000}, due_at: {type: string, format: date-time, nullable: true}}}
    ModerationRequest: {type: object, required: [decision], properties: {decision: {type: string, enum: [approve, request_revision, reject, hide]}, comment: {type: string}}}
    Comment: {type: object, required: [comment_id, resource_type, resource_id, author_id, body, status, reply_count, likes_count, liked_by_me, created_at], properties: {comment_id: {type: string, format: uuid}, resource_type: {type: string, enum: [case, student_project]}, resource_id: {type: string, format: uuid}, parent_comment_id: {type: string, format: uuid, nullable: true}, author_id: {type: string, format: uuid}, body: {type: string}, status: {type: string, enum: [active, deleted, hidden]}, reply_count: {type: integer}, likes_count: {type: integer, minimum: 0}, liked_by_me: {type: boolean}, created_at: {type: string, format: date-time}}}
    CommentLikeState: {type: object, required: [likes_count, liked_by_me], properties: {likes_count: {type: integer, minimum: 0}, liked_by_me: {type: boolean}}}
    CuratorAssignment: {type: object, required: [student_id, curator_id, curator_name, assigned_by, assigned_at], properties: {student_id: {type: string, format: uuid}, curator_id: {type: string, format: uuid}, curator_name: {type: string}, assigned_by: {type: string, format: uuid}, assigned_at: {type: string, format: date-time}}}
    ReportInput: {type: object, required: [resource_type, resource_id, reason], properties: {resource_type: {type: string, enum: [case, student_project, comment, profile, company, internship]}, resource_id: {type: string, format: uuid}, reason: {type: string, enum: [spam, abuse, fraud, copyright, personal_data, other]}, details: {type: string, maxLength: 4000}}}
    TeamDiscoveryInput: {type: object, required: [name, visibility, looking_for_members], properties: {name: {type: string}, description: {type: string}, visibility: {type: string, enum: [private, open]}, looking_for_members: {type: boolean}}}
    TeamJoinInput: {type: object, properties: {role_id: {type: string, format: uuid}, resume_file_id: {type: string, format: uuid}, cover_letter: {type: string, maxLength: 4000}}}
    TeamSearchProfileInput: {type: object, properties: {headline: {type: string, maxLength: 200}, description: {type: string, maxLength: 4000}, resume_file_id: {type: string, format: uuid}, is_visible: {type: boolean}}}
    ApplicationInput: {type: object, required: [case_id], properties: {case_id: {type: string, format: uuid}, team_id: {type: string, format: uuid}, cover_letter: {type: string}, resume_file_id: {type: string, format: uuid}, portfolio_url: {type: string, format: uri}, github_url: {type: string, format: uri}}}
    EvaluationInput: {type: object, required: [scores], properties: {feedback: {type: string}, scores: {type: array, items: {type: object, required: [criterion_id, score], properties: {criterion_id: {type: string, format: uuid}, score: {type: number, minimum: 0}, comment: {type: string}}}}}}
    PlacementsInput: {type: object, required: [placements], properties: {placements: {type: array, items: {type: object, required: [execution_id], properties: {execution_id: {type: string, format: uuid}, place_no: {type: integer, minimum: 1}, nomination: {type: string}}}}}}
    StudentProjectInput: {type: object, required: [title, category, short_description, full_description], properties: {title: {type: string}, category: {type: string, enum: [coursework, pet_project, startup, research, hackathon, other]}, short_description: {type: string}, full_description: {type: string}, visibility: {type: string, enum: [public, private], default: public}, tags: {type: array, maxItems: 10, uniqueItems: true, items: {type: string, maxLength: 40}}, cover_file_id: {type: string, format: uuid}}}
    InternshipInput: {type: object, required: [company_id, title, summary, content_markdown], properties: {company_id: {type: string, format: uuid}, title: {type: string}, summary: {type: string}, content_markdown: {type: string}, file_ids: {type: array, maxItems: 30, items: {type: string, format: uuid}}, capacity: {type: integer, minimum: 1, maximum: 10000, description: При создании обязателен лимит людей.}, application_deadline: {type: string, format: date-time}}}
    RoleRequestDecision: {type: object, required: [status], properties: {status: {type: string, enum: [approved, rejected]}}}
    StudentSearchItem:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        full_name: {type: string}
        group_name: {type: string}
        education_level: {type: string}
        curator_id: {type: string, format: uuid}
        rating: {type: number}
    CasePlanStage:
      type: object
      required: [title]
      properties:
        stage_id: {type: string, description: UUID существующей точки или пустая строка для новой.}
        case_id: {type: string, format: uuid, readOnly: true}
        ordinal: {type: integer, minimum: 1, readOnly: true}
        title: {type: string, minLength: 1, maxLength: 300}
        expected_result: {type: string, maxLength: 3000}
        due_at: {type: string, format: date-time, nullable: true}
    CasePlanUpdate:
      type: object
      required: [previous, stages]
      properties:
        previous: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CasePlanStage'}}
        stages: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CasePlanStage'}}
        reason: {type: string, maxLength: 1000}
    StudentProfileUpdate:
      type: object
      required: [email, first_name, last_name, institute, direction, course, group_name]
      properties:
        email: {type: string, format: email}
        first_name: {type: string}
        last_name: {type: string}
        patronymic: {type: string}
        institute: {type: string}
        direction: {type: string}
        program: {type: string}
        education_level: {type: string}
        course: {type: integer, minimum: 1, maximum: 8}
        group_name: {type: string}
        phone: {type: string}
        bio: {type: string, maxLength: 2000}
        professional_interests: {type: array, maxItems: 50, items: {type: string}}
        competencies: {type: array, maxItems: 50, items: {type: string}}
        technologies: {type: array, maxItems: 50, items: {type: string}}
        links: {type: array, maxItems: 50, items: {type: object, required: [kind, url], properties: {kind: {type: string}, url: {type: string, format: uri}}}}
    EventRegistrationInput: {type: object, required: [case_id, applicant_type], properties: {case_id: {type: string, format: uuid}, applicant_type: {type: string, enum: [individual, team]}, team_id: {type: string, format: uuid}}}
    EventRegistration: {type: object, required: [application_id, entry_kind, status], properties: {application_id: {type: string, format: uuid}, entry_kind: {type: string, enum: [registration]}, status: {type: string, enum: [accepted, consent_pending]}, execution_id: {type: string, format: uuid, nullable: true}}}
    DeadlineChange: {type: object, required: [due_at, reason], properties: {due_at: {type: string, format: date-time}, reason: {type: string, minLength: 1, maxLength: 1000}}}
    EventPlan:
      type: object
      required: [subject, time_zone]
      properties:
        subject: {type: string}
        time_zone: {type: string, example: Asia/Yekaterinburg}
        venue_name: {type: string}
        address: {type: string}
        building: {type: string}
        room: {type: string}
        platform_name: {type: string}
        platform_url: {type: string, format: uri}
        regulations: {type: string}
        agenda: {type: string}
        defense_at: {type: string, format: date-time}
        rounds: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/EventRound'}}
    EventRound: {type: object, required: [title, opens_at, due_at], properties: {round_id: {type: string, format: uuid, readOnly: true}, title: {type: string}, opens_at: {type: string, format: date-time}, due_at: {type: string, format: date-time}, rules: {type: string}, tasks: {type: array, items: {$ref: '#/components/schemas/EventTask'}}}}
    EventTask: {type: object, required: [title, statement, max_score], properties: {task_id: {type: string, format: uuid, readOnly: true}, title: {type: string}, statement: {type: string}, max_score: {type: number, minimum: 0, exclusiveMinimum: true}, file_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}}}}
    EventSolution: {type: object, required: [task_id], properties: {task_id: {type: string, format: uuid}, text: {type: string}, url: {type: string, format: uri}, file_id: {type: string, format: uuid}}}
    EventTaskScore: {type: object, required: [task_id, score], properties: {task_id: {type: string, format: uuid}, score: {type: number, minimum: 0}}}
    EventRoundSubmissionInput: {type: object, required: [solutions], properties: {solutions: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/EventSolution'}}}}
    EventRoundEvaluationInput: {type: object, required: [scores], properties: {scores: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/EventTaskScore'}}}}
    EventRoundResults:
      type: object
      required: [items, total_score]
      properties:
        total_score: {type: number}
        items:
          type: array
          items:
            type: object
            properties:
              round_id: {type: string, format: uuid}
              execution_id: {type: string, format: uuid}
              submitted_at: {type: string, format: date-time}
              evaluated_at: {type: string, format: date-time, nullable: true}
              evaluator_name: {type: string}
              file_metadata: {type: array, items: {type: object, properties: {file_id: {type: string, format: uuid}, original_name: {type: string}, mime_type: {type: string}, size_bytes: {type: integer, format: int64}}}}
              total_score: {type: number, nullable: true}
              max_score: {type: number, nullable: true}
              solutions: {type: array, items: {$ref: '#/components/schemas/EventSolution'}}
              scores: {type: array, items: {$ref: '#/components/schemas/EventTaskScore'}}
    FeedbackInput: {type: object, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 4000}, file_ids: {type: array, maxItems: 5, uniqueItems: true, items: {type: string, format: uuid}}}}
    FeedbackDecision: {type: object, required: [status], properties: {status: {type: string, enum: [reviewed, accepted, rejected]}}}
    Feedback: {type: object, properties: {feedback_id: {type: string, format: uuid}, author_id: {type: string, format: uuid}, body: {type: string}, status: {type: string, enum: [reviewing, reviewed, accepted, rejected]}, file_ids: {type: array, items: {type: string, format: uuid}}, moderator_id: {type: string, format: uuid, nullable: true}, created_at: {type: string, format: date-time}, reviewed_at: {type: string, format: date-time, nullable: true}}}
    InternshipApplicationInput: {type: object, properties: {cover_letter: {type: string, maxLength: 4000}, resume_file_id: {type: string, format: uuid}}}
    InternshipApplicationDecision: {type: object, required: [status], properties: {status: {type: string, enum: [accepted, rejected, withdrawn]}}}
    InternshipApplication: {type: object, properties: {application_id: {type: string, format: uuid}, program_id: {type: string, format: uuid}, student_id: {type: string, format: uuid}, cover_letter: {type: string}, resume_file_id: {type: string, format: uuid, nullable: true}, status: {type: string, enum: [submitted, accepted, rejected, withdrawn]}, created_at: {type: string, format: date-time}, decided_at: {type: string, format: date-time, nullable: true}}}
    ResultReviewDetails:
      type: object
      properties:
        files: {type: array, items: {type: object, properties: {file_id: {type: string, format: uuid}, original_name: {type: string}, mime_type: {type: string}, size_bytes: {type: integer, format: int64}}}}
        evaluators: {type: array, items: {type: object, properties: {evaluation_id: {type: string, format: uuid}, name: {type: string}}}}
    PortfolioFileInput: {type: object, required: [file_id, kind, visibility], properties: {file_id: {type: string, format: uuid}, kind: {type: string, enum: [resume, portfolio, certificate, other]}, is_default: {type: boolean}, visibility: {type: string, enum: [public, private]}}}
    NDAInput: {type: object, required: [text], properties: {text: {type: string, minLength: 1, maxLength: 50000}, file_id: {type: string, format: uuid}}}
