  /exports:
    get:
      tags: [Platform]
      operationId: exportData
      security: [{bearerAuth: []}]
      parameters: [{name: resource, in: query, required: true, schema: {type: string}}, {name: format, in: query, required: true, schema: {type: string, enum: [csv, xlsx, pdf]}}]
      responses: {'200': {description: Сформированный файл}}
  /nda-grants/{grant_id}:
    patch:
      tags: [Cases]
