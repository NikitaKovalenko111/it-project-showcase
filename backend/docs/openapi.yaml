openapi: 3.0.3
info:
  title: IT Project Showcase API
  version: 1.0.0
  description: |
    Канонический контракт backend. Все бизнес-маршруты имеют префикс `/api/v1`.
    Access token передаётся как Bearer JWT. Refresh token является серверной сессией и ротируется.
    Большие коллекции используют cursor pagination либо page pagination, явно указанную у операции.
servers:
  - url: /api/v1
    description: Current server
tags:
  - {name: System}
  - {name: Auth}
  - {name: Users}
  - {name: Catalogs}
  - {name: Companies}
  - {name: Cases}
  - {name: Teams}
  - {name: Applications}
  - {name: Executions}
  - {name: Results}
  - {name: Student projects}
  - {name: Community}
  - {name: Internships}
  - {name: Portfolio}
  - {name: Platform}
  - {name: Files}
security: []
paths:
  /system/health:
    get:
      tags: [System]
      operationId: health
      summary: Проверка процесса backend
      responses:
        '200': {description: Backend работает}
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerStudent
      summary: Регистрация студента
      description: Роль назначает только сервер; публичная регистрация всегда создаёт студента.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}
      responses:
        '201': {description: Пользователь создан, content: {application/json: {schema: {$ref: '#/components/schemas/AuthTokens'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход по email или username и паролю
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}
      responses:
        '200': {description: Токены выданы, content: {application/json: {schema: {$ref: '#/components/schemas/AuthTokens'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '423': {description: Учётная запись временно заблокирована}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Ротация refresh token
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}
      responses:
        '200': {description: Новая пара токенов, content: {application/json: {schema: {$ref: '#/components/schemas/AuthTokens'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Отзыв текущей refresh-сессии
      security: [{bearerAuth: []}]
      responses: {'204': {description: Сессия отозвана}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Текущий пользователь и серверные роли
      security: [{bearerAuth: []}]
      responses: {'200': {description: Профиль пользователя}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /users/{user_id}/status:
    patch:
      tags: [Users]
      operationId: setUserStatus
      summary: Активировать, заблокировать или мягко удалить пользователя
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserID'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [active, blocked, deleted]}}}}
      responses: {'204': {description: Статус изменён}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /catalogs/{catalog}:
    get:
      tags: [Catalogs]
      operationId: listCatalog
      summary: Получить справочник
      parameters:
        - {name: catalog, in: path, required: true, schema: {type: string, enum: [directions, competencies, technologies, team-roles]}}
      responses: {'200': {description: Элементы справочника, content: {application/json: {schema: {$ref: '#/components/schemas/ItemsResponse'}}}}}
    post:
      tags: [Catalogs]
      operationId: createCatalogItem
      summary: Добавить элемент справочника
      security: [{bearerAuth: []}]
      parameters:
        - {name: catalog, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}}
      responses: {'201': {description: Элемент создан}, '403': {$ref: '#/components/responses/Forbidden'}}
  /companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: Список компаний
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Компании, content: {application/json: {schema: {$ref: '#/components/schemas/CursorPage'}}}}}
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Создать карточку компании
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompanyInput'}}}}
      responses: {'201': {description: Компания создана}, '403': {$ref: '#/components/responses/Forbidden'}}
  /companies/{company_id}:
    get:
      tags: [Companies]
      operationId: getCompany
      parameters: [{$ref: '#/components/parameters/CompanyID'}]
      responses: {'200': {description: Компания}, '404': {$ref: '#/components/responses/NotFound'}}
    put:
      tags: [Companies]
      operationId: updateCompany
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CompanyID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompanyInput'}}}}
      responses: {'200': {description: Компания обновлена}, '403': {$ref: '#/components/responses/Forbidden'}}
  /companies/{company_id}/logo:
    get:
      tags: [Companies, Files]
      operationId: getCompanyLogo
      parameters: [{$ref: '#/components/parameters/CompanyID'}]
      responses: {'200': {description: Изображение}, '404': {$ref: '#/components/responses/NotFound'}}
    put:
      tags: [Companies, Files]
      operationId: uploadCompanyLogo
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CompanyID'}]
      requestBody: {$ref: '#/components/requestBodies/FileUpload'}
      responses: {'200': {description: Логотип сохранён}, '415': {description: Неподдерживаемый MIME}}
  /cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: Витрина кейсов
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: search, in: query, schema: {type: string}}, {name: company_id, in: query, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Кейсы, content: {application/json: {schema: {$ref: '#/components/schemas/CursorPage'}}}}}
    post:
      tags: [Cases]
      operationId: createCase
      summary: Создать кейс с динамическими критериями
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CaseInput'}}}}
      responses: {'201': {description: Кейс создан}, '422': {$ref: '#/components/responses/Validation'}}
  /cases/{case_id}:
    get:
      tags: [Cases]
      operationId: getCase
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      responses: {'200': {description: Публичный кейс}, '404': {$ref: '#/components/responses/NotFound'}}
    put:
      tags: [Cases]
      operationId: updateCase
      description: После выхода из draft критерии оценки менять нельзя.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CaseInput'}}}}
      responses: {'200': {description: Новая версия кейса}, '409': {$ref: '#/components/responses/Conflict'}}
  /cases/{case_id}/status:
    patch:
      tags: [Cases]
      operationId: cancelCase
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [cancelled]}}}}}}
      responses: {'200': {description: Кейс отменён}, '409': {$ref: '#/components/responses/Conflict'}}
  /cases/{case_id}/moderation:
    patch:
      tags: [Cases]
      operationId: moderateCase
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModerationRequest'}}}}
      responses: {'200': {description: Решение записано}, '403': {$ref: '#/components/responses/Forbidden'}}
  /cases/{case_id}/comments:
    get:
      tags: [Community]
      operationId: listCaseComments
      parameters: [{$ref: '#/components/parameters/CaseID'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {name: sort, in: query, schema: {type: string, enum: [newest, oldest, popular], default: newest}}]
      responses: {'200': {description: Корневые комментарии, content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}}}
    post:
      tags: [Community]
      operationId: createCaseComment
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {$ref: '#/components/requestBodies/Comment'}
      responses: {'201': {description: Комментарий, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}}
  /comments/{comment_id}/replies:
    get:
      tags: [Community]
      operationId: listCommentReplies
      parameters: [{$ref: '#/components/parameters/CommentID'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Ответы по 10 по умолчанию}}
    post:
      tags: [Community]
      operationId: createCommentReply
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CommentID'}]
      requestBody: {$ref: '#/components/requestBodies/Comment'}
      responses: {'201': {description: Ответ создан}}
  /comments/{comment_id}:
    delete:
      tags: [Community]
      operationId: deleteComment
      summary: Мягко удалить свой комментарий или любой комментарий администратором
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CommentID'}]
      responses: {'204': {description: Удалён}, '404': {$ref: '#/components/responses/NotFound'}}
  /reports:
    post:
      tags: [Community]
      operationId: createReport
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportInput'}}}}
      responses: {'201': {description: Жалоба создана}, '409': {$ref: '#/components/responses/Conflict'}}
    get:
      tags: [Community]
      operationId: listReports
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {name: status, in: query, schema: {type: string, enum: [open, reviewing, resolved, rejected]}}]
      responses: {'200': {description: Очередь жалоб}, '403': {$ref: '#/components/responses/Forbidden'}}
  /reports/{report_id}:
    patch:
      tags: [Community]
      operationId: moderateReport
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ReportID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [reviewing, resolved, rejected]}, resolution: {type: string}}}}}}
      responses: {'200': {description: Жалоба обновлена}}
  /teams:
    get:
      tags: [Teams]
      operationId: listOpenTeams
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Открытые команды}}
    post:
      tags: [Teams]
      operationId: createTeam
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}}
      responses: {'201': {description: Команда создана}}
  /teams/{team_id}/discovery:
    put:
      tags: [Teams]
      operationId: updateTeamDiscovery
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TeamID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeamDiscoveryInput'}}}}
      responses: {'204': {description: Настройки сохранены}}
  /teams/{team_id}/join-applications:
    post:
      tags: [Teams]
      operationId: applyToTeam
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TeamID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeamJoinInput'}}}}
      responses: {'201': {description: Отклик создан}, '409': {$ref: '#/components/responses/Conflict'}}
    get:
      tags: [Teams]
      operationId: listTeamApplications
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TeamID'}]
      responses: {'200': {description: Отклики команды}}
  /team-join-applications/{application_id}:
    patch:
      tags: [Teams]
      operationId: respondTeamApplication
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ApplicationID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [accepted, rejected]}}}}}}
      responses: {'204': {description: Решение применено}}
  /team-search-profile/me:
    put:
      tags: [Teams]
      operationId: updateTeamSearchProfile
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeamSearchProfileInput'}}}}
      responses: {'200': {description: Анкета сохранена}}
  /team-search-profiles:
    get:
      tags: [Teams]
      operationId: listTeamSearchProfiles
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Видимые анкеты}}
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Доступные пользователю заявки}}
    post:
      tags: [Applications]
      operationId: createApplication
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationInput'}}}}
      responses: {'201': {description: Заявка создана}}
  /applications/{application_id}/consents:
    post:
      tags: [Applications]
      operationId: consentApplication
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ApplicationID'}]
      responses: {'204': {description: Согласие с версией условий записано}}
  /executions/{execution_id}:
    get:
      tags: [Executions]
      operationId: getExecution
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ExecutionID'}]
      responses: {'200': {description: Выполнение и зафиксированный состав}}
  /executions/{execution_id}/submissions:
    get:
      tags: [Results]
      operationId: listSubmissions
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ExecutionID'}]
      responses: {'200': {description: Версии результатов}}
    post:
      tags: [Results]
      operationId: createSubmission
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ExecutionID'}]
      responses: {'201': {description: Результат создан}}
  /submissions/{submission_id}/evaluations:
    get:
      tags: [Results]
      operationId: listEvaluations
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionID'}]
      responses: {'200': {description: Оценки}}
    post:
      tags: [Results]
      operationId: createEvaluation
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationInput'}}}}
      responses: {'201': {description: Оценка; total_score и max_score вычислены сервером}}
  /cases/{case_id}/leaderboard:
    get:
      tags: [Results]
      operationId: getLeaderboard
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      responses: {'200': {description: Общий рейтинг выполнений}}
  /cases/{case_id}/leaderboard/placements:
    put:
      tags: [Results]
      operationId: setPlacements
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlacementsInput'}}}}
      responses: {'200': {description: Места сохранены}, '409': {description: Не все выполнения оценены}}
  /student-projects:
    get:
      tags: [Student projects]
      operationId: listStudentProjects
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Только published + public проекты}}
    post:
      tags: [Student projects]
      operationId: createStudentProject
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentProjectInput'}}}}
      responses: {'201': {description: Черновик создан}}
  /student-projects/{project_id}:
    get:
      tags: [Student projects]
      operationId: getStudentProject
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      responses: {'200': {description: Публичный проект}, '404': {$ref: '#/components/responses/NotFound'}}
    put:
      tags: [Student projects]
      operationId: updateStudentProject
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentProjectInput'}}}}
      responses: {'200': {description: Черновик обновлён}}
  /student-projects/{project_id}/comments:
    get:
      tags: [Community]
      operationId: listProjectComments
      parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Комментарии проекта}}
    post:
      tags: [Community]
      operationId: createProjectComment
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProjectID'}]
      requestBody: {$ref: '#/components/requestBodies/Comment'}
      responses: {'201': {description: Комментарий создан}}
  /internships:
    get:
      tags: [Internships]
      operationId: listInternships
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Опубликованные программы}}
    post:
      tags: [Internships]
      operationId: createInternship
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InternshipInput'}}}}
      responses: {'201': {description: Черновик программы}}
  /internships/{program_id}:
    get:
      tags: [Internships]
      operationId: getInternship
      parameters: [{$ref: '#/components/parameters/ProgramID'}]
      responses: {'200': {description: Программа с Markdown-содержимым}}
  /internships/{program_id}/status:
    patch:
      tags: [Internships]
      operationId: updateInternshipStatus
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProgramID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [moderation, published, revision, closed, hidden]}, comment: {type: string}}}}}}
      responses: {'200': {description: Статус изменён}}
  /portfolio/me/files:
    get:
      tags: [Portfolio]
      operationId: listMyPortfolioFiles
      security: [{bearerAuth: []}]
      responses: {'200': {description: Все файлы владельца}}
    post:
      tags: [Portfolio]
      operationId: attachPortfolioFile
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioFileInput'}}}}
      responses: {'201': {description: Файл связан с профилем}}
  /portfolio/me/files/{file_id}:
    delete:
      tags: [Portfolio]
      operationId: detachPortfolioFile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/FileID'}]
      responses: {'204': {description: Связь мягко удалена}}
  /application-defaults:
    get:
      tags: [Portfolio]
      operationId: getApplicationDefaults
      security: [{bearerAuth: []}]
      responses: {'200': {description: GitHub, резюме и файлы для предварительного заполнения}}
  /students/{student_id}/rating:
    get:
      tags: [Portfolio]
      operationId: getStudentRating
      parameters: [{$ref: '#/components/parameters/StudentID'}]
      responses: {'200': {description: Рейтинг 0–100 и четыре компонента}}
  /students/search:
    get:
      tags: [Platform]
      operationId: searchStudents
      security: [{bearerAuth: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string}}
        - {name: technology, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [rating_desc, rating_asc]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses: {'200': {description: Результаты поиска с серверным рейтингом}}
  /students/{student_id}/curator:
    get:
      tags: [Portfolio]
      operationId: getStudentCurator
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/StudentID'}]
      responses: {'200': {description: Активный куратор}}
    put:
      tags: [Portfolio]
      operationId: setStudentCurator
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/StudentID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [curator_id], properties: {curator_id: {type: string, format: uuid}}}}}}
      responses: {'200': {description: Куратор назначен}}
    delete:
      tags: [Portfolio]
      operationId: revokeStudentCurator
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/StudentID'}]
      responses: {'204': {description: Назначение отозвано}}
  /cases/{case_id}/nda:
    get:
      tags: [Cases]
      operationId: getCurrentNDA
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      responses: {'200': {description: Текущая точная версия NDA}}
  /cases/{case_id}/nda-versions:
    post:
      tags: [Cases]
      operationId: createNDAVersion
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NDAInput'}}}}
      responses: {'201': {description: Версия создана}}
  /cases/{case_id}/nda-grants:
    get:
      tags: [Cases]
      operationId: listNDAGrants
      security: [{bearerAuth: []}]
