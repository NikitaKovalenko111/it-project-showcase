openapi: 3.0.3
info:
  title: IT Project Showcase API
  version: 1.0.0
  description: |
    Канонический контракт backend. Все бизнес-маршруты имеют префикс `/api/v1`.
    ### Авторизация
    Операции с символом замка требуют короткоживущий access token.
    Нажмите **Authorize**, вставьте только значение `access_token` без слова `Bearer`.
    Swagger UI автоматически отправит HTTP-заголовок `Authorization: Bearer <access_token>`.
    Refresh token в этот заголовок не передаётся: он является серверной сессией,
    используется только в теле `/auth/refresh` и ротируется при обновлении токенов.

    Большие коллекции используют cursor pagination либо page pagination, явно указанную у операции.
servers:
  - url: /api/v1
    description: Current server
tags:
  - {name: System}
  - {name: Auth}
  - {name: Users}
  - {name: Catalogs}
  - {name: Companies}
  - {name: Cases}
  - {name: Teams}
  - {name: Applications}
  - {name: Executions}
  - {name: Results}
  - {name: Student projects}
  - {name: Community}
  - {name: Internships}
  - {name: Portfolio}
  - {name: Platform}
  - {name: Files}
security: []
paths:
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      description: 'Модератор получает учётные записи и состояние заявок на роли.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /users/{user_id}/role-request:
    patch:
      tags: [Users]
      operationId: reviewUserRole
      description: 'Модератор одобряет или отклоняет запрошенную роль.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UserID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequestDecision'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /students/me/profile:
    put:
      tags: [Users]
      operationId: replaceStudentProfile
      description: 'Студент сохраняет личные и учебные данные своего профиля.'
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentProfileUpdate'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /companies/mine:
    get:
      tags: [Companies]
      operationId: listMyCompanies
      description: 'Представитель получает компании со своим активным членством.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatCursorPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /cases/mine:
    get:
      tags: [Cases]
      operationId: listMyCases
      description: 'Представитель получает кейсы управляемых компаний.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatCursorPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /teams/mine:
    get:
      tags: [Teams]
      operationId: listMyTeams
      description: 'Пользователь получает команды со своим активным членством.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /event-registrations:
    post:
      tags: [Applications]
      operationId: registerForEvent
      description: 'Регистрация на хакатон или олимпиаду. Команда зачисляется после согласия всех участников.'
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventRegistrationInput'}}}}
      responses:
        '201': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/EventRegistration'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
        '409': {description: 'event_capacity_reached или wrong_event_entry_kind'}
  /cases/{case_id}/view:
    put:
      tags: [Cases]
      operationId: recordCaseView
      description: 'Учитывает один просмотр от авторизованного пользователя.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /cases/{case_id}/deadline-history:
    get:
      tags: [Cases]
      operationId: listCaseDeadlineHistory
      description: История переносов для управляющей компании и модератора.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: История переносов, content: {application/json: {schema: {$ref: '#/components/schemas/FlatPage'}}}}
        '403': {description: Недостаточно прав}
  /cases/{case_id}/deadline:
    patch:
      tags: [Cases]
      operationId: changeCaseDeadline
      description: 'Компания меняет дедлайн для всех активных выполнений.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeadlineChange'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /cases/{case_id}/stages/{stage_id}/deadline:
    patch:
      tags: [Cases]
      operationId: changeCaseStageDeadline
      description: 'Компания меняет срок общей контрольной точки.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}, {$ref: '#/components/parameters/StageID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeadlineChange'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /cases/{case_id}/rounds/{round_id}/deadline:
    patch:
      tags: [Cases]
      operationId: changeEventRoundDeadline
      description: 'Компания меняет дедлайн тура для всех участников.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}, {name: round_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeadlineChange'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /cases/{case_id}/event-plan:
    get:
      tags: [Cases]
      operationId: getEventPlan
      description: 'Расписание мероприятия. Условия и материалы тура доступны участнику с момента открытия.'
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/EventPlan'}}}}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
    put:
      tags: [Cases]
      operationId: setEventPlan
      description: 'Представитель заменяет план черновика или кейса на доработке до начала выполнений.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventPlan'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /cases/{case_id}/rounds/{round_id}/tasks/{task_id}/files/{file_id}:
    get:
      tags: [Files]
      operationId: downloadEventTaskFile
      description: 'Скачивание условия задачи с проверкой времени открытия и участия.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CaseID'}, {name: round_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/FileID'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /executions/{execution_id}/rounds/{round_id}/submission:
    post:
      tags: [Results]
      operationId: submitEventRound
      description: 'Участник сдаёт все подготовленные решения одной работой в пределах времени тура.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ExecutionID'}, {name: round_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventRoundSubmissionInput'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
        '409': {description: 'event_round_closed или event_round_already_submitted'}
  /executions/{execution_id}/rounds/{round_id}/evaluation:
    put:
      tags: [Results]
      operationId: gradeEventRound
      description: 'Компания или модератор выставляет баллы по каждому заданию тура.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ExecutionID'}, {name: round_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventRoundEvaluationInput'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /executions/{execution_id}/round-submissions:
    get:
      tags: [Results]
      operationId: listEventRoundSubmissions
      description: 'Сданные туры и суммарные баллы выполнения.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ExecutionID'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/EventRoundResults'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /executions/{execution_id}/rounds/{round_id}/files/{file_id}:
    get:
      tags: [Files]
      operationId: downloadEventSolutionFile
      description: 'Скачать файл решения участнику выполнения, компании или модератору.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ExecutionID'}, {name: round_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/FileID'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /submissions/{submission_id}/review-details:
    get:
      tags: [Results]
      operationId: getSubmissionReviewDetails
      description: 'Названия файлов и имена оценивших для управляющего представителя или модератора.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/SubmissionID'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/ResultReviewDetails'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /feedback:
    get:
      tags: [Community]
      operationId: listFeedback
      description: 'Очередь обращений модератора.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {name: status, in: query, schema: {type: string, enum: [reviewing, reviewed, accepted, rejected]}}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
    post:
      tags: [Community]
      operationId: createFeedback
      description: 'Отправить обращение с максимум пятью вложениями по 2 МиБ.'
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackInput'}}}}
      responses:
        '201': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/Feedback'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /feedback/mine:
    get:
      tags: [Community]
      operationId: listMyFeedback
      description: 'Список обращений текущего пользователя.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /feedback/{feedback_id}/status:
    patch:
      tags: [Community]
      operationId: reviewFeedback
      description: 'Модератор принимает или отклоняет обращение без текстового ответа.'
      security: [{bearerAuth: []}]
      parameters: [{name: feedback_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackDecision'}}}}
      responses:
        '204': {description: 'Действие выполнено'}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
  /feedback/{feedback_id}/files/{file_id}:
    get:
      tags: [Files]
      operationId: downloadFeedbackFile
      description: 'Скачать приватное вложение может автор или модератор.'
      security: [{bearerAuth: []}]
      parameters: [{name: feedback_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/FileID'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /internships/{program_id}/applications:
    post:
      tags: [Internships]
      operationId: applyForInternship
      description: 'Студент подаёт заявку на стажировку.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProgramID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InternshipApplicationInput'}}}}
      responses:
        '201': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/InternshipApplication'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
    get:
      tags: [Internships]
      operationId: listInternshipApplications
      description: 'Компания получает заявки на свою стажировку.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ProgramID'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /internships/applications/mine:
    get:
      tags: [Internships]
      operationId: listMyInternshipApplications
      description: 'Студент получает свои заявки.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/FlatPage'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /internships/applications/{application_id}/status:
    patch:
      tags: [Internships]
      operationId: decideInternshipApplication
      description: 'Компания принимает или отклоняет заявку. Студент может отозвать свою заявку.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ApplicationID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InternshipApplicationDecision'}}}}
      responses:
        '200': {description: 'Успешный ответ', content: {application/json: {schema: {$ref: '#/components/schemas/InternshipApplication'}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
        '422': {description: Некорректные данные}
        '409': {description: 'internship_capacity_reached'}
  /internships/applications/{application_id}/resume:
    get:
      tags: [Files]
      operationId: downloadInternshipResume
      description: 'Скачать резюме могут автор заявки, управляющий представитель и модератор.'
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/ApplicationID'}]
      responses:
        '200': {description: 'Успешный ответ', content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {description: Требуется Bearer access token}
        '403': {description: Недостаточно прав}
        '404': {description: Ресурс недоступен}
  /system/health:
    get:
      tags: [System]
      operationId: health
      summary: Проверка процесса backend
      responses:
        '200': {description: Backend работает}
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerStudent
      summary: Регистрация студента
      description: Роль назначает только сервер; публичная регистрация всегда создаёт студента.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}
      responses:
        '201': {description: Учётная запись создана, content: {application/json: {schema: {type: object, properties: {user_id: {type: string, format: uuid}, message: {type: string}}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход по email или username и паролю
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}
      responses:
        '200': {description: Токены выданы, content: {application/json: {schema: {$ref: '#/components/schemas/AuthTokens'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '423': {description: Учётная запись временно заблокирована}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Ротация refresh token
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [refresh_token], properties: {refresh_token: {type: string}}}}
      responses:
        '200': {description: Новая пара токенов, content: {application/json: {schema: {$ref: '#/components/schemas/AuthTokens'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Отзыв текущей refresh-сессии
      security: [{bearerAuth: []}]
