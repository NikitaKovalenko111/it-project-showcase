name: it-project-showcase

services:
  minio:
    build:
      context: ./deploy/minio
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
        MINIO_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    container_name: it-project-showcase-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: showcase
      MINIO_ROOT_PASSWORD: showcase-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
