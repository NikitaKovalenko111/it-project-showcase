log_level: "dev"
http_server:
    http_address: ":3005"
    http_timeout: 30s
    http_idle_timeout: 60s
    cors_allowed_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:3001"
      - "http://127.0.0.1:3001"
jwt:
    jwt_access_secret: "aaaaaaaaaaaaaaaaa"
    jwt_refresh_secret: "rrrrrrrrrrrrrrrrr"
    access_token_ttl: "15m"
    refresh_token_ttl: "1h"
    session_cleanup_interval: "30m"
object_storage:
    endpoint: "minio:9000"
    access_key: "showcase-local"
    secret_key: "showcase-local-development"
    bucket: "test-bucket"
    use_ssl: false
    region: "us-east-1"
    max_file_size: 20971520
postgres:
  db_host: "postgres"
  db_user: "postgres"
  db_port: 5432
  db_pass: "showcase-local-development"
  db_name: "showcase"
  ssl_mode: "disable"
