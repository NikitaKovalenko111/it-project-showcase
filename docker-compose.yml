name: it-project-showcase

services:
  minio:
    build:
      context: ./backend/deploy/minio
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
        MINIO_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    container_name: it-project-showcase-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: showcase
      MINIO_ROOT_PASSWORD: showcase-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - /bin/busybox
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9000/minio/health/ready
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: it-project-showcase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: showcase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./backend
    container_name: it-project-showcase-server
    restart: unless-stopped
    volumes:
      - ./backend/config/config.yaml:/server/config/config.yaml:ro
    environment:
      db_host: postgres
      db_port: "5432"
      db_user: showcase
      db_pass: ${POSTGRES_PASSWORD}
      db_name: showcase
      ssl_mode: disable
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3005:3005"

volumes:
  minio-data:
  postgres-data:
