name: showcase-integration
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: showcase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: showcase-local-development
    volumes:
      - integration-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d showcase"]
      interval: 3s
      retries: 20
  minio:
    build:
      context: ./backend/deploy/minio
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
        MINIO_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: showcase-local
      MINIO_ROOT_PASSWORD: showcase-local-development
    volumes:
      - integration-minio:/data
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.integration
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure:3
volumes:
  integration-postgres:
  integration-minio:
