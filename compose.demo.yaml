name: showcase-demo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: showcase_demo
      POSTGRES_USER: showcase_demo
      POSTGRES_PASSWORD: showcase-demo-local-db
    volumes:
      - postgres-demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase_demo -d showcase_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: ./backend/deploy/minio
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
        MINIO_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: showcase-demo
      MINIO_ROOT_PASSWORD: showcase-demo-local-storage
    volumes:
      - minio-demo:/data
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      # The frontend proxies /api on its own origin for any published port.
      cors_allowed_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:3006,http://127.0.0.1:3006"
    networks:
      default:
        aliases: [server]
    ports:
      - "127.0.0.1:${SHOWCASE_DEMO_PORT:-13006}:3005"
    volumes:
      - type: bind
        source: ./demo/config.demo.yaml
        target: /server/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "127.0.0.1:${SHOWCASE_DEMO_FRONTEND_PORT:-3006}:80"
    depends_on:
      api:
        condition: service_started
volumes:
  postgres-demo:
  minio-demo:
